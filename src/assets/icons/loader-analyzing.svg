<svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .center-dot { animation: pulse 2s infinite ease-in-out; transform-origin: center; }
    .outer-ring { animation: spin 3s infinite linear; transform-origin: center; }
  </style>
  <circle class="outer-ring" cx="25" cy="25" r="20" stroke="#10B981" stroke-width="2" stroke-dasharray="30 10" stroke-opacity="0.8" />
  <circle cx="25" cy="25" r="12" stroke="#34D399" stroke-width="1" stroke-opacity="0.3" />
  <path class="center-dot" d="M25 15 L31 20 L31 30 L25 35 L19 30 L19 20 Z" fill="#10B981" />
</svg>
