<svg width="100%" height="100%" viewBox="0 0 400 200" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- 背景网格线 -->
  <path d="M0 100 H 400" stroke="#1e293b" stroke-width="1" stroke-opacity="0.2" />
  <path d="M0 50 H 400" stroke="#1e293b" stroke-width="1" stroke-opacity="0.1" />
  <path d="M0 150 H 400" stroke="#1e293b" stroke-width="1" stroke-opacity="0.1" />
  
  <!-- 波浪线 1 -->
  <path d="M0 100 Q 100 50 200 100 T 400 100" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.3" fill="none"/>
  
  <!-- 流光动画线 -->
  <path d="M0 100 Q 100 50 200 100 T 400 100" stroke="url(#flowGrad)" stroke-width="2" fill="none" stroke-dasharray="420" stroke-dashoffset="420">
    <animate attributeName="stroke-dashoffset" from="420" to="-420" duration="3s" repeatCount="indefinite" />
  </path>
  
  <!-- 粒子点缀 -->
  <circle cx="0" cy="0" r="2" fill="#60A5FA">
    <animateMotion path="M0 100 Q 100 50 200 100 T 400 100" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
