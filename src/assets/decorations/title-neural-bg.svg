<svg width="800" height="300" viewBox="0 0 800 300" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="brainGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60A5FA" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
       <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6" />
       <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 神经网络连接线 -->
  <path d="M100 150 Q 250 50 400 150 T 700 150" stroke="url(#brainGrad)" stroke-width="1.5" fill="none" />
  <path d="M150 200 Q 300 250 400 150 T 650 100" stroke="url(#brainGrad)" stroke-width="1" fill="none" />
  <path d="M200 100 Q 350 150 400 150 T 600 200" stroke="url(#brainGrad)" stroke-width="1" fill="none" />
  <path d="M50 180 Q 200 280 400 150 T 750 80" stroke="url(#brainGrad)" stroke-width="0.8" fill="none" />

  <!-- 浮动节点 -->
  <g>
     <circle cx="400" cy="150" r="80" fill="url(#nodeGlow)" opacity="0.4">
        <animate attributeName="r" values="80;100;80" dur="8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.4;0.2;0.4" dur="8s" repeatCount="indefinite" />
     </circle>
     <circle cx="400" cy="150" r="4" fill="#3B82F6" />
     
     <circle cx="250" cy="100" r="3" fill="#60A5FA" opacity="0.6">
        <animate attributeName="cy" values="100;110;100" dur="5s" repeatCount="indefinite" />
     </circle>
     
     <circle cx="550" cy="200" r="3" fill="#60A5FA" opacity="0.6">
        <animate attributeName="cy" values="200;190;200" dur="6s" repeatCount="indefinite" />
     </circle>
     
      <circle cx="150" cy="200" r="2" fill="#8B5CF6" opacity="0.5" />
      <circle cx="650" cy="100" r="2" fill="#8B5CF6" opacity="0.5" />
  </g>

  <!-- 移动的数据脉冲 -->
  <circle r="3" fill="#FFFFFF">
    <animateMotion path="M100 150 Q 250 50 400 150 T 700 150" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" />
  </circle>
  
   <circle r="2" fill="#FFFFFF">
    <animateMotion path="M50 180 Q 200 280 400 150 T 750 80" dur="6s" begin="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite" />
  </circle>

</svg>
