<svg width="100%" height="100" viewBox="0 0 800 100" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <linearGradient id="streamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 静态轨道 -->
  <path d="M0 20 H800" stroke="#94A3B8" stroke-width="1" stroke-opacity="0.1"/>
  <path d="M0 50 H800" stroke="#94A3B8" stroke-width="1" stroke-opacity="0.1"/>
  <path d="M0 80 H800" stroke="#94A3B8" stroke-width="1" stroke-opacity="0.1"/>
  
  <!-- 动态光流 -->
  <rect x="0" y="19" width="100" height="2" fill="url(#streamGrad)" opacity="0.8">
    <animate attributeName="x" from="-100" to="800" dur="2s" repeatCount="indefinite" />
  </rect>
   <rect x="0" y="49" width="150" height="2" fill="url(#streamGrad)" opacity="0.6">
    <animate attributeName="x" from="-150" to="800" dur="3s" repeatCount="indefinite" />
  </rect>
   <rect x="0" y="79" width="80" height="2" fill="url(#streamGrad)" opacity="0.9">
    <animate attributeName="x" from="-80" to="800" dur="1.5s" repeatCount="indefinite" />
  </rect>
</svg>
