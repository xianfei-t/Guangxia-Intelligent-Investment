<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blurFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40" />
    </filter>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- 呼吸光晕 -->
  <circle cx="250" cy="250" r="150" fill="url(#glowGrad)" filter="url(#blurFilter)">
    <animate attributeName="r" values="150;180;150" duration="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.8;0.6" duration="6s" repeatCount="indefinite" />
  </circle>
  
  <!-- 核心亮点 -->
  <circle cx="250" cy="250" r="50" fill="#8B5CF6" filter="url(#blurFilter)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.6;0.3" duration="3s" repeatCount="indefinite" />
  </circle>
</svg>
