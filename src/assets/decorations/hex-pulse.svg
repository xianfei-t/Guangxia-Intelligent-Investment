<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
      <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      </linearGradient>
  </defs>
  <!-- 中心大六边形 -->
  <path d="M100 20 L170 60 V140 L100 180 L30 140 V60 Z" stroke="url(#hexGrad)" stroke-width="1" fill="none" stroke-dasharray="10 5" />
  
  <!-- 内部旋转的圆环 -->
  <circle cx="100" cy="100" r="60" stroke="#60A5FA" stroke-width="1" stroke-dasharray="40 10" stroke-opacity="0.3">
     <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite" />
  </circle>
  
  <!-- 内部反向旋转的六边形 -->
   <path d="M100 50 L143 75 V125 L100 150 L57 125 V75 Z" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="15s" repeatCount="indefinite" />
   </path>

  <!-- 脉冲点 -->
  <circle cx="100" cy="100" r="2" fill="#60A5FA">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;30;2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
